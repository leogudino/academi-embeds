  PLANTILLA · Home de la plataforma Emi + revelado paso a paso de los momentos del curso.
  Para un cliente nuevo se cambia SOLO el bloque CONFIG de abajo: espacio de trabajo, textos,
  y por momento: nombre completo, color (identidad de marca: NO se modifica; va en la franja,
  el borde de la etapa, el anillo del ícono y el borde de la etiqueta — nunca de fondo), ancla (etapas por default; {"menu": N, "seccion": "…"} para un ítem del menú
  lateral — "seccion" solo con un nombre verificado en la plataforma), texto (párrafos de la
  placa del curso) y etapas con contador. `curso.intro` / `curso.cierre` son los pasos 1 y 6
  (sin momento; usan `curso.colorNeutro`). `curso.portada` (título, consigna, botón) es la pantalla
  inicial, estilo portada de curso Academi (referencia de Leo): fondo lila, retícula, abstracción de la
  Home (grilla de etapas con franjas de momento, sin texto legible), título, subtítulo, EMPEZAR, logo academi. El diseño del recuadro de etapa es UI fija del
  producto (patterns-library §18): no tocar el CSS para "adaptarlo" a un cliente.
  Regla: nada de datos de prueba visibles — todo verosímil para el cliente (ver DECISIONES.md).
  "Emi" dentro de un nombre de momento se dibuja con el wordmark a color (fondo claro).
  Sistema de color de las piezas del curso = el del video: pleno + claro (pleno al 10% sobre
  blanco) del mismo momento, texto #262626.
  Uso: bloque "Iframe" de Innform → URL pública de esta página.
-->

  .cover { --u: calc(100vw / 1920); position: relative; display: none; width: 100%; min-height: 100vh; overflow: hidden; background: #73A4FF; color: #FFFFFF; font-family: "Neris", var(--font); }
  .screen.cover-on > .cover { display: flex; align-items: center; }
  .cover .cv { position: relative; width: 100%; height: calc(1080 * var(--u)); flex-shrink: 0; }
  .cover .tile { position: absolute; border-radius: calc(50 * var(--u)); background: rgba(255,255,255,var(--a, .3)); }
  .cover .badge { position: absolute; left: calc(153 * var(--u)); top: calc(229 * var(--u)); width: calc(116 * var(--u)); height: calc(116 * var(--u)); border-radius: calc(23.2 * var(--u)); background: linear-gradient(180deg, #895EF6 0%, #3179FF 100%); display: flex; align-items: center; justify-content: center; }
  .cover .badge svg { width: calc(66 * var(--u)); height: calc(66 * var(--u)); }
  .cover-title { position: absolute; left: calc(153 * var(--u)); top: calc(394 * var(--u)); width: calc(1060 * var(--u)); margin: 0; font-weight: 700; font-size: calc(92 * var(--u)); line-height: calc(96 * var(--u)); letter-spacing: calc(-2.8 * var(--u)); color: #FFFFFF; }
  .cover-title .kw { white-space: nowrap; }
  .cover-title img { height: calc(84 * var(--u)); width: auto; vertical-align: calc(-8 * var(--u)); margin-left: calc(16 * var(--u)); }
  .cover .btn { position: absolute; left: calc(153 * var(--u)); top: calc(650 * var(--u)); font-family: "Neris", var(--font); font-weight: 700; font-size: calc(30 * var(--u)); letter-spacing: 0; padding: calc(22 * var(--u)) calc(52 * var(--u)); border-radius: calc(16 * var(--u)); background: #3179FF; box-shadow: 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(23,52,120,.25); }
  .cover .btn:hover { filter: brightness(1.06); }
  .cover .academi { position: absolute; left: calc(153 * var(--u)); top: calc(868 * var(--u)); height: calc(86 * var(--u)); width: auto; }

  /* ---------- UI de producto ---------- */
  .topbar { height: 44px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; padding: 0 18px 0 16px; flex-shrink: 0; }
  .topbar .burger { width: 20px; height: 20px; flex-shrink: 0; }
  .topbar .logo { height: 30px; }
  .topbar .sep { width: 1px; height: 20px; background: var(--border); }
  .topbar .ws { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .user { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--blue); white-space: nowrap; display: flex; align-items: center; gap: 6px; }

  .body { display: flex; flex: 1; min-height: 0; }
  .rail { width: 60px; background: var(--rail); flex-shrink: 0; position: relative; }
  /* íconos = recortes raster de producción (no SVG); cada ítem es un cuadro de 40 centrado en x=30 */
  /* el PNG no se tiñe ni se escala: el resaltado es un anillo alrededor, con el ícono intacto encima */
  .rail-item { position: absolute; left: 10px; width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; transition: opacity var(--t), box-shadow var(--t); top: calc(22px + var(--i) * 48px); }
  @media (max-width: 760px) { .rail-item { top: calc(12px + var(--i) * 40px); } }

  .content { flex: 1; min-width: 0; container-type: inline-size; }
  .greeting { height: 86px; display: flex; align-items: center; padding: 8px 0 0 23px; border-bottom: 1px solid var(--border); font-size: 24px; font-weight: 600; }
  .stage { padding: 24px 17px 24px 23px; display: flex; flex-direction: column; gap: 20px; }
  .workspace { flex: 1; min-width: 0; }

  .workspace { border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); padding: 24px; }
  .ws-head { height: 28px; margin-bottom: 13px; display: flex; align-items: center; justify-content: space-between; }
  .ws-head .name { display: flex; align-items: center; gap: 18px; font-size: 16px; font-weight: 700; }
  .ws-head .link { font-size: 14px; font-weight: 700; color: var(--blue); margin: 14px 31px 0 0; white-space: nowrap; }

  /* recuadros fluidos: mínimo legible 190px, máximo 3 columnas (como el Home real, 3 × 310 + 2 × 24) */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 24px; max-width: 978px; }

  .card { position: relative; width: 100%; height: 134px; padding: 16px 16px 25px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); display: flex; flex-direction: column; justify-content: space-between; transition: opacity var(--t), transform var(--t), border-color var(--t), box-shadow var(--t); }
  .card .label { max-width: min(200px, calc(100% - 56px)); font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label); }
  .card .count { font-size: 42px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .go { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 6px; background: var(--white); display: flex; align-items: center; justify-content: center; }
  .card .accent { position: absolute; top: -1px; bottom: -1px; left: -1px; width: 4px; background: var(--accent); border-radius: var(--radius) 0 0 var(--radius); opacity: 0; transition: opacity var(--t); }

  /* ---------- capa del curso ---------- */
  .dim { opacity: .3; }
  .card.on { border-color: var(--accent); }
  .card.on .accent { opacity: 1; }
  .card.hi { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 28px rgba(17,24,39,.10); transform: scale(1.03); z-index: 2; }
  .rail-item.on { box-shadow: 0 0 0 2px var(--accent); }
  .rail-item.hi { box-shadow: 0 0 0 3px var(--accent), 0 0 0 9px color-mix(in srgb, var(--accent) 22%, transparent); z-index: 3; }
  .burger { border-radius: 999px; transition: box-shadow var(--t); }
  .burger.hi { box-shadow: 0 0 0 6px var(--rail), 0 0 0 9px var(--accent), 0 0 0 15px color-mix(in srgb, var(--accent) 22%, transparent); }

  /* etiqueta de momento — sistema de color del video (colors.ts / MomentoCards.tsx): borde en el color
     pleno, fondo = pleno al 10% sobre blanco (tint(accent, .1)), texto siempre #262626, wordmark a color */
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 10%, #FFFFFF); color: #262626; border: 3px solid var(--accent); font-size: 14px; line-height: 18px; font-weight: 700; white-space: nowrap; }
  .tag img { height: 14px; width: auto; display: block; }
  /* etiqueta del grupo: anclada al borde superior de la primera etapa del momento */
  .card .tag { position: absolute; top: -13px; left: 12px; opacity: 0; transform: translateY(6px); transition: opacity var(--t), transform var(--t); z-index: 3; }
  .card.hi .tag { opacity: 1; transform: none; }

  /* cartel con flecha para anclas del menú (solo cuando el momento está activo) */
  .callout { position: absolute; z-index: 5; opacity: 0; pointer-events: none; transition: opacity var(--t), transform var(--t); transform: translateX(-6px); }
  .callout.show { opacity: 1; transform: none; }
  .callout .box { display: inline-flex; flex-direction: column; gap: 3px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 10%, #FFFFFF); color: #262626; border: 3px solid var(--accent); box-shadow: 0 10px 28px rgba(17,24,39,.18); }
  .callout .box .tag { padding: 0; border: 0; }
  .callout .box small { font-size: 12px; line-height: 14px; font-weight: 400; color: #4B5563; white-space: nowrap; }
  .callout .arrow { position: absolute; width: 0; height: 0; border: 8px solid transparent; }
  .callout.left .arrow { left: -15px; top: 50%; margin-top: -8px; border-right-color: var(--accent); }
  .callout.top .arrow { top: -15px; left: 14px; border-bottom-color: var(--accent); }

  /* ---------- placa del curso — sistema de cards del video (MomentoCards.tsx):
     fondo pleno al 10%, borde izquierdo 5px pleno, radio 13, título Lato 700 #262626 con wordmark ---------- */
  .panel { order: -1; border-radius: 13px; border-left: 5px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, #FFFFFF); padding: 18px 22px 20px; color: #262626; transition: background-color var(--t), border-color var(--t); }
  .panel-title { margin: 0 0 10px; font-size: 20px; line-height: 26px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 0 .3em; }
  .panel-title img { height: 19px; width: auto; display: block; }
  .panel-body p { margin: 0 0 10px; font-size: 15px; line-height: 1.55; font-weight: 400; }
  .panel-body p:last-child { margin-bottom: 0; }
  .panel .legend { margin-top: 14px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 18px; }
  .btn { font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--white); background: var(--blue); border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  .btn:hover { filter: brightness(.95); }
  .btn:focus-visible { outline: 3px solid #BFD3FF; outline-offset: 2px; }
  .step { font-size: 13px; color: var(--label); }
  .legend { display: none; flex-wrap: wrap; gap: 8px 10px; }
  .legend.show { display: flex; }

  /* ancho: la placa va al costado derecho (fija al scroll) y el Home conserva sus columnas */
  @container (min-width: 1040px) {
    .stage { flex-direction: row; align-items: flex-start; }
    .panel { order: 1; width: 320px; flex-shrink: 0; position: sticky; top: 24px; }
  }

  /* ---------- MODO COMPACTO — caso principal: iframe de Innform (~480px de ancho, alto fijo, sin
     scroll interno). 2 columnas, tarjetas de 76px, encabezado mínimo, placa DEBAJO del Home con el
     botón al pie. Se activa por ancho de la ventana (el iframe define el viewport). ---------- */
  @media (max-width: 760px) {
    .topbar { height: 36px; gap: 10px; padding: 0 12px; }
    .topbar .logo { height: 22px; }
    .topbar .sep { height: 16px; }
    .topbar .ws { font-size: 12px; }
    .topbar .user { font-size: 13px; }
    .rail { width: 44px; }
    .rail-item { left: 6px; width: 32px; height: 32px; }
    .greeting { display: none; }
    .stage { padding: 10px; gap: 10px; }
    .panel { order: -1; padding: 8px 10px 10px; border-left-width: 4px; border-radius: 8px; }
    .panel-title { font-size: 20px; line-height: 25px; margin-bottom: 6px; }
    .panel-title img { height: 18px; }
    .panel-body p { font-size: 16px; line-height: 1.4; margin-bottom: 6px; }
    .panel .legend { margin-top: 8px; gap: 6px 6px; }
    .panel .legend .tag { font-size: 13px; line-height: 16px; padding: 2px 9px; }
    .panel .legend .tag img { height: 13px; }
    .controls { margin-top: 8px; gap: 8px 12px; }
    .btn { font-size: 13px; padding: 7px 14px; border-radius: 5px; }
    .step { font-size: 12px; }
    .workspace { padding: 10px; }
    .ws-head { height: 20px; margin-bottom: 8px; }
    .ws-head .name { gap: 8px; font-size: 12px; }
    .ws-head .name svg { width: 14px; height: 14px; }
    .ws-head .link { font-size: 11px; margin: 0; }
    /* recuadros: 4 columnas fijas (8 etapas = 2 filas parejas), todas de la misma altura (la del nombre más largo),
       nombre entero (2–3 líneas, nunca puntos suspensivos), contador chico, flecha en la esquina */
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px; padding-top: 6px; }
    .card { height: auto; min-height: 66px; padding: 7px 8px 7px; border-radius: 6px; gap: 6px; }
    .card .label { font-size: 13px; line-height: 16px; max-width: calc(100% - 18px); }
    .card .count { font-size: 18px; }
    .card .go { top: 5px; right: 5px; width: 16px; height: 16px; border-radius: 3px; }
    .card .go svg { width: 9px; height: 9px; }
    .card .accent { width: 3px; border-radius: 6px 0 0 6px; }
    .card.hi { transform: scale(1.02); }
    .card .tag { top: -10px; left: 6px; }
    .tag { font-size: 10px; line-height: 12px; padding: 1px 6px; border-width: 2px; gap: 3px; }
    .tag img { height: 10px; }
    .callout { display: none; } /* en compacto la placa está arriba, donde caería el cartel; el anillo en el ícono + el texto de la placa lo reemplazan */
    .callout .box { padding: 6px 9px; border-width: 2px; border-radius: 8px; gap: 2px; }
    .callout .box small { font-size: 11px; line-height: 13px; }
    .callout .arrow { border-width: 6px; }
    .callout.left .arrow { left: -11px; margin-top: -6px; }
    .callout.top .arrow { top: -11px; left: 10px; }
  }
  /* por debajo de 640px, 4 columnas partirían palabras ("Documentación" no entra a 13px): 3 columnas (3+3+2) */
  @media (max-width: 639px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* muy angosto (teléfono chico): 1 columna y el menú se colapsa en el ☰ */
  @media (max-width: 400px) {
    .rail { display: none; }
    .topbar .ws { display: none; }
  }
</style>

    $("coverTitle").innerHTML = (t => { const m = t.match(/^(.*?)(\S+)\s+Emi$/); return m ? `${m[1].trim()} <span class="kw">${m[2]}<img src="${WM_WHITE}" alt="Emi"></span>` : t; })(pc.titulo);
    $("start").textContent = pc.boton;
    $("start").addEventListener("click", () => { cover = false; step = 0; showCover(false); render(); reveal(); });
  }
  // ?paso=N (1..6) abre directo en ese paso — para enlazar desde el curso
  const pasoParam = parseInt(new URLSearchParams(location.search).get("paso") || "", 10);
  const panel = $("panel");
  function renderPanel(step) {
    const active = step >= 1 && step <= total ? step - 1 : -1;
    const src = active >= 0 ? { titulo: CFG.momentos[active].nombre, texto: CFG.momentos[active].texto, color: CFG.momentos[active].color }
      : step === 0 ? { ...CFG.curso.intro, color: CFG.curso.colorNeutro } : { ...CFG.curso.cierre, color: CFG.curso.colorNeutro };
    panel.style.setProperty("--accent", src.color);
    // si el momento ya está etiquetado sobre las etapas (o en el cartel), la placa no repite el título
    const labelledElsewhere = active >= 0 && (CFG.momentos[active].etapas.length > 0 || (anchorFor(CFG.momentos[active]) && getComputedStyle(callout).display !== "none"));
    $("panelTitle").style.display = labelledElsewhere ? "none" : "";
    $("panelTitle").innerHTML = withWordmark(src.titulo);
    $("panelBody").innerHTML = (src.texto || []).map(t => `<p>${t}</p>`).join("");
  }
  let step = 0;
  const callout = $("callout");

  function anchorFor(m) {
    if (!m.ancla || !m.ancla.menu) return null;
    const railVisible = getComputedStyle($("rail")).display !== "none";
    return railVisible ? railItems[m.ancla.menu - 1] : $("burger");
  }
  function placeCallout(m) {
    const el = anchorFor(m);
    if (!el) { callout.classList.remove("show"); return; }
    const box = callout.querySelector(".box");
    box.style.setProperty("--accent", m.color);
    box.innerHTML = tagHTML(m) + (m.ancla.seccion ? `<small>${m.ancla.seccion}</small>` : "");
    const s = $("screen").getBoundingClientRect(), r = el.getBoundingClientRect();
    const railVisible = el !== $("burger");
    callout.classList.toggle("left", railVisible); callout.classList.toggle("top", !railVisible);
    if (railVisible) { callout.style.left = (r.right - s.left + 14) + "px"; callout.style.top = (r.top - s.top + r.height / 2 - callout.offsetHeight / 2) + "px"; }
    else { callout.style.left = (r.left - s.left) + "px"; callout.style.top = (r.bottom - s.top + 12) + "px"; }
    callout.classList.add("show");
  }

  function render() {
    const active = step >= 1 && step <= total ? step - 1 : -1;
    const final = step === total + 1;
    groups.forEach((g, gi) => g.cards.forEach(c => {
      c.classList.toggle("hi", gi === active);
      c.classList.toggle("on", final);
      c.classList.toggle("dim", active >= 0 && gi !== active);
    }));
    railItems.forEach((it, i) => {
      const owner = CFG.momentos.find(m => m.ancla && m.ancla.menu === i + 1);
      const isActive = owner && CFG.momentos.indexOf(owner) === active;
      it.style.setProperty("--accent", owner ? owner.color : "transparent");
      it.classList.toggle("hi", !!isActive);
      it.classList.toggle("on", final && !!owner);
      it.classList.toggle("dim", active >= 0 && !isActive);
    });
    const menuActive = active >= 0 && CFG.momentos[active].ancla && CFG.momentos[active].ancla.menu;
    if (menuActive) placeCallout(CFG.momentos[active]); else callout.classList.remove("show");
    const burger = $("burger"), burgerHi = !!menuActive && anchorFor(CFG.momentos[active]) === burger;
    burger.classList.toggle("hi", burgerHi);
    if (burgerHi) burger.style.setProperty("--accent", CFG.momentos[active].color);
    legend.classList.toggle("show", final);
    renderPanel(step);
    $("next").textContent = final ? CFG.textos.reiniciar : CFG.textos.siguiente;
    $("stepLabel").textContent = CFG.textos.paso.replace("{n}", step + 1).replace("{total}", TOTAL_STEPS);
  }
  // Lleva la vista al elemento destacado. Solo scrollea ESTE documento (dentro de un iframe
  // no mueve la página que lo contiene, a diferencia de scrollIntoView).
  function reveal() {
    if (matchMedia("(max-width: 760px)").matches) return; // compacto: la escena entra sin scroll
    const active = step >= 1 && step <= total ? step - 1 : -1;
    const sideBySide = getComputedStyle($("stage")).flexDirection === "row";
    let target = null;
    // apilado (placa arriba del Home): la vista va al texto; al costado (placa fija): va al elemento destacado
    if (!sideBySide) target = panel;
    else if (active >= 0) { const m = CFG.momentos[active]; target = anchorFor(m) || (groups[active].cards[0] || null); }
    const top = target ? target.getBoundingClientRect().top + scrollY - (sideBySide ? Math.max(24, (innerHeight - 300) / 2) : 12) : 0;
    scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }
  $("next").addEventListener("click", () => {
    if (step === total + 1) { step = 0; if (CFG.curso && CFG.curso.portada) { cover = true; showCover(true); scrollTo({ top: 0, behavior: "instant" }); } render(); reveal(); return; }
    step += 1; render(); reveal();
  });
  addEventListener("resize", () => render());
  // Alto real de la escena: expuesto en window.__escenaAlto y avisado al padre por postMessage
  // (solo sirve si el contenedor lo escucha; Innform no lo hace — ahí va alto fijo).
  const announceHeight = () => { const el = screen.classList.contains("cover-on") ? $("cover") : $("stage"); const h = Math.round(el.getBoundingClientRect().bottom + scrollY); window.__escenaAlto = h; try { parent.postMessage({ type: "emi-embed-height", height: h }, "*"); } catch (e) {} };
  $("next").addEventListener("click", () => setTimeout(announceHeight, 450));
  addEventListener("load", announceHeight); addEventListener("resize", announceHeight);
  if (pasoParam >= 1 && pasoParam <= TOTAL_STEPS) { step = pasoParam - 1; cover = false; }
  showCover(cover);
  render();
  // ?debug=1 — muestra el tamaño real del viewport (para calibrar el iframe de Innform)
  if (new URLSearchParams(location.search).get("debug") === "1") {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;right:6px;bottom:6px;z-index:99;font:11px/1 monospace;background:#262626;color:#fff;padding:4px 6px;border-radius:4px;opacity:.85";
    const sceneHeight = () => { const el = screen.classList.contains("cover-on") ? $("cover") : $("stage"); return Math.round(el.getBoundingClientRect().bottom + scrollY); };
    const upd = () => { d.textContent = `${innerWidth}×${innerHeight} · escena ${sceneHeight()}px`; };
    upd(); addEventListener("resize", upd); $("next").addEventListener("click", () => setTimeout(upd, 100));
    document.body.appendChild(d);
  }
</script>
